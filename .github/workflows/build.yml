name: Build APK

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      variant:
        required: true
        type: string
      archs:
        required: false
        type: string
        default: '["all", "arm", "arm64", "x86", "x86_64"]'
    secrets:
      KEY_PASSWORD:
        required: false
      STORE_PASSWORD:
        required: false
      OAUTH_CLIENT_ID:
        required: false
      CURSEFORGE_API_KEY:
        required: false
      LEGAL_DOCS_TOKEN:
        required: false

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ${{ fromJSON(inputs.archs) }}
      fail-fast: false

    env:
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      LEGAL_DOCS_TOKEN: ${{ secrets.LEGAL_DOCS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: "on-failure"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            PetLib/rust/target
          key: petlib-rust-${{ runner.os }}-${{ hashFiles('PetLib/rust/Cargo.lock') }}
          restore-keys: petlib-rust-${{ runner.os }}-

      - name: Install cargo-ndk
        run: |
          version="4.1.2"
          curl -sL "https://github.com/bbqsrc/cargo-ndk/releases/download/v${version}/cargo-ndk-x86_64-unknown-linux-gnu-v${version}.tgz" |
            tar xz -C "$HOME/.cargo/bin" --strip-components=1
          chmod +x "$HOME/.cargo/bin"/cargo-ndk*
          cargo ndk --version

      - name: Setup Android NDK
        run: |
          ndk=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$ndk" ] || [ ! -f "$ndk/source.properties" ]; then
            sdkmanager --install "ndk;27.0.12077973"
            ndk=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          fi
          echo "Using NDK at $ndk"
          test -f "$ndk/source.properties"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Build APK for ${{ matrix.arch }}
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assemble${{ inputs.variant }} -Darch=${{ matrix.arch }}

      - name: Verify Release APK for ${{ matrix.arch }}
        if: inputs.variant == 'Release'
        run: |
          set -euo pipefail
          shopt -s nullglob
          case "${{ matrix.arch }}" in
            arm) abi="armeabi-v7a" ;;
            arm64) abi="arm64-v8a" ;;
            x86) abi="x86" ;;
            x86_64) abi="x86_64" ;;
            *) abi="all" ;;
          esac

          files=(ZalithLauncher/build/outputs/apk/release/*.apk)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no release APK was produced for ${{ matrix.arch }}"
            exit 1
          fi

          for f in "${files[@]}"; do
            echo "APK: $f ($(du -h "$f" | cut -f1))"
          done

          if [ "$abi" != "all" ]; then
            apk=""
            for f in "${files[@]}"; do
              case "$f" in *-"$abi".apk) apk="$f" ;; esac
            done
            if [ -z "$apk" ]; then
              echo "::error::expected an APK named *-$abi.apk for ${{ matrix.arch }}, got: ${files[*]}"
              exit 1
            fi

            #split APK 内只应保留目标 ABI 的 native 库
            libabis=$(unzip -Z1 "$apk" | grep '^lib/' | cut -d/ -f2 | sort -u || true)
            if [ -n "$libabis" ] && [ "$libabis" != "$abi" ]; then
              echo "::error::$(basename "$apk") contains unexpected ABIs: $(echo $libabis)"
              exit 1
            fi
            echo "Verified $abi natives in $(basename "$apk")"
          fi

      - name: Upload Release APK for ${{ matrix.arch }}
        if: inputs.variant == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: release apk (${{ matrix.arch }})
          path: ZalithLauncher/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Release Mapping for ${{ matrix.arch }}
        if: inputs.variant == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: mapping (${{ matrix.arch }})
          path: ZalithLauncher/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Upload Debug APK for ${{ matrix.arch }}
        if: inputs.variant == 'Debug'
        uses: actions/upload-artifact@v7
        with:
          name: debug apk (${{ matrix.arch }})
          path: ZalithLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
